name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest

    # The API's integration tests run against a real TimescaleDB: the SQL, the
    # constraints and the continuous aggregate are what they are checking.
    services:
      db:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_USER: spring
          POSTGRES_PASSWORD: spring
          POSTGRES_DB: spring
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spring -d spring"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://spring:spring@localhost:5432/spring

    steps:
      - uses: actions/checkout@v5

      # pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:migrate

      - run: pnpm nx format:check
      - run: pnpm nx run-many -t lint test build typecheck
