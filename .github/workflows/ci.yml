name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # A manual run of main deploys it again, which is how to retry a failed deploy.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest

    # The API's integration tests run against a real TimescaleDB: the SQL, the
    # constraints and the continuous aggregate are what they are checking.
    services:
      db:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_USER: spring
          POSTGRES_PASSWORD: spring
          POSTGRES_DB: spring
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spring -d spring"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://spring:spring@localhost:5432/spring

    steps:
      - uses: actions/checkout@v5

      # pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:migrate

      - run: pnpm nx format:check
      - run: pnpm nx run-many -t lint test build typecheck

  # Runs only for main, and only once every check above has passed on that
  # commit. The secrets belong to the "production" environment, so a pull request
  # cannot read them. See docs/deploy.md for how the key and the server are set up.
  deploy:
    needs: main
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    # Two merges in a row deploy one after the other, never at the same time.
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The server's key is pinned in DEPLOY_KNOWN_HOSTS, so a changed or
          # unknown host is refused instead of trusted. The sha is the "command";
          # the server runs infra/prod/deploy.sh with it, whatever is sent.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "$GITHUB_SHA"
