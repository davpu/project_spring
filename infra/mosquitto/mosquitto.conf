persistence true
persistence_location /mosquitto/data/

# Plain MQTT for local development only. In production the listener is TLS (8883).
listener 1883
allow_anonymous false

# Clients, roles and ACLs are managed at runtime through the dynamic-security plugin.
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json
