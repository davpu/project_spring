persistence true
persistence_location /mosquitto/data/

# Plain listener for the API only. It is not published by the compose file, so
# it is reachable from the other containers and nowhere else.
listener 1883
allow_anonymous false

# Gateways connect here, over TLS. The certificate is the one Caddy obtained
# for the domain, copied in by entrypoint.sh.
listener 8883
certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem
tls_version tlsv1.2

# Clients, roles and ACLs are managed at runtime through the dynamic-security plugin.
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json
