# Local development stack: Postgres + TimescaleDB and the MQTT broker.
# Usage (from repo root): docker compose --env-file .env -f infra/docker-compose.yml up -d
name: spring

services:
  db:
    image: timescale/timescaledb:latest-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spring}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spring}
      POSTGRES_DB: ${POSTGRES_DB:-spring}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    environment:
      # Bootstrap admin for the dynamic-security plugin, used by the API to
      # manage per-gateway credentials and to subscribe to telemetry.
      MQTT_ADMIN_USER: ${MQTT_ADMIN_USER:-api}
      MQTT_ADMIN_PASSWORD: ${MQTT_ADMIN_PASSWORD:-api-dev-password}
    ports:
      - '${MQTT_PORT:-1883}:1883'
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/entrypoint.sh:/entrypoint.sh:ro
      - mosquitto-data:/mosquitto/data
    entrypoint: ['/bin/sh', '/entrypoint.sh']
    command: ['/usr/sbin/mosquitto', '-c', '/mosquitto/config/mosquitto.conf']

  # The gateway: validates telemetry from local nodes against the generated
  # contract and republishes it upstream unchanged. Credentials and GATEWAY_ID
  # are set by hand in .env until the API implements pairing.
  nodered:
    image: nodered/node-red:4.0
    restart: unless-stopped
    ports:
      - '127.0.0.1:${NODE_RED_PORT:-1880}:1880' # editor from this machine only
    environment:
      TZ: ${TZ:-Europe/Prague}
      MQTT_HOST: mosquitto
      MQTT_PORT: '1883'
      GATEWAY_ID: ${GATEWAY_ID:-}
      MQTT_GATEWAY_USER: ${MQTT_GATEWAY_USER:-}
      MQTT_GATEWAY_PASSWORD: ${MQTT_GATEWAY_PASSWORD:-}
      # Node-RED only substitutes an env reference that is a field's entire
      # value, so the composed client id is built here rather than in the flow.
      MQTT_CLIENT_ID: gateway-${GATEWAY_ID:-dev}
    volumes:
      - ./nodered/data:/data
      # Generated from libs/shared by `pnpm contract:gen`. After regenerating,
      # `docker compose restart nodered` is enough; the flow is not edited.
      - ./nodered/contract:/contract:ro
    depends_on:
      - mosquitto

volumes:
  db-data:
  mosquitto-data:
