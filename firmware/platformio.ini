; ESP32 node: reads one planter's sensors and publishes telemetry to the
; gateway's local MQTT broker.
;
; The payload and topic contract is include/contract.h, generated from
; libs/shared by `pnpm contract:gen` - do not edit it by hand.
;
; Per-device settings (WiFi, broker, sensor key) go in include/config.h,
; which is gitignored. Copy include/config.h.example to start.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    bblanchon/ArduinoJson@^7.4.3
    knolleary/PubSubClient@^2.8
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.15
